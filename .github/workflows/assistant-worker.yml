name: Asistente de reglas (Worker)

# Pruebas y comprobación de tipos del Worker del asistente de reglas (worker/) en cada cambio, y
# despliegue manual a Cloudflare (workflow_dispatch). Ver worker/README.md. El despliegue necesita
# los secretos CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_API_TOKEN (este último con permiso de editar
# Workers Scripts además de Workers AI); si faltan, se salta con un aviso claro.
on:
  pull_request:
    paths:
      - "worker/**"
      - ".github/workflows/assistant-worker.yml"
  push:
    paths:
      - "worker/**"
      - ".github/workflows/assistant-worker.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Desplegar el Worker a Cloudflare después de las pruebas"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: assistant-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        run: |
          missing=""
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="Faltan los secretos:$missing. Créalos en Settings → Secrets and variables → Actions (ver worker/README.md). No se despliega nada."
          echo "::warning::$msg"
          echo "### Asistente: $msg" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'

      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        if: steps.secrets.outputs.ok == 'true'
        run: npm ci

      - name: Deploy
        if: steps.secrets.outputs.ok == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -Eo 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "### Asistente desplegado: ${url:-ver el registro}" >> "$GITHUB_STEP_SUMMARY"
          echo "Pega esa URL en Ajustes → Asistente (ASSISTANT_URL) de la app." >> "$GITHUB_STEP_SUMMARY"
