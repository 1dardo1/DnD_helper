name: Generar retratos con IA

# Genera con Cloudflare Workers AI (FLUX.1 schnell, gratis) los retratos que faltan y los sube a la
# rama de revisión portraits/<kind> para revisarlos antes de llevarlos a la rama principal (nunca
# directamente a ella). Ver tools/portraits/README.md. Hacen falta los secretos
# CLOUDFLARE_ACCOUNT_ID y CLOUDFLARE_API_TOKEN (Settings → Secrets and variables → Actions).
#
# - species: app/public/species/ (van dentro de la app). Caben en una ejecución.
# - monsters: media/monsters/ (fuera de la app: se publican solo en GitHub Pages, pages.yml). Son
#   331 y la cuota gratuita da para ~170 al día: cada ejecución sigue la rama portraits/monsters
#   por donde se quedó la anterior. Basta con relanzarla al día siguiente; además, la ejecución
#   diaria programada (schedule) lo hace sola mientras falten monstruos, y no hace nada si no hay
#   secretos o no falta ninguno.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: "Qué retratar"
        type: choice
        options: [species, monsters]
        default: species
      only:
        description: "Solo estos ids, separados por comas (se rehacen aunque ya existan). Vacío: los que faltan"
        type: string
        default: ""
      force:
        description: "Rehacer todos (aunque ya existan)"
        type: boolean
        default: false
      changed:
        description: "Rehacer también los que tienen el prompt o la seed cambiados"
        type: boolean
        default: false
      limit:
        description: "Como mucho N imágenes (0 = sin límite; la cuota gratuita da para ~170 al día)"
        type: string
        default: "0"
  schedule:
    # every day at 04:23 UTC (the free quota resets at 00:00 UTC): the monsters that are missing
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: portraits
  cancel-in-progress: false

jobs:
  portraits:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # the scheduled run has no inputs: monsters, only the missing ones
      KIND: ${{ inputs.kind || 'monsters' }}
      ONLY: ${{ inputs.only }}
      FORCE: ${{ inputs.force }}
      CHANGED: ${{ inputs.changed }}
      LIMIT: ${{ inputs.limit || '0' }}
      SCHEDULED: ${{ github.event_name == 'schedule' }}
      BRANCH: portraits/${{ inputs.kind || 'monsters' }}
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          if [ -z "$missing" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          msg="Faltan los secretos:$missing. Créalos en Settings → Secrets and variables → Actions (ver tools/portraits/README.md)."
          if [ "$SCHEDULED" = "true" ]; then
            # the daily run does nothing (and doesn't fail every day) until the secrets exist
            echo "::notice::$msg Ejecución programada: no se hace nada."
            echo "### Retratos: $msg (ejecución programada: no se hace nada)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::$msg"
          echo "### Retratos: $msg" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          fetch-depth: 0 # to continue the review branch and merge the current one into it

      - name: Continue the review branch, if there is one
        if: steps.secrets.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null; then
            # the pictures of the earlier runs (not merged yet) count as done; the merge brings the
            # newer prompts and data from the current branch
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if ! git merge --no-edit "origin/$GITHUB_REF_NAME"; then
              git merge --abort || true
              msg="La rama $BRANCH no se puede fusionar con $GITHUB_REF_NAME (conflicto). Resuélvelo, o fusiona/borra la rama, y vuelve a lanzarlo."
              echo "::error::$msg"
              echo "### Retratos: $msg" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "Se sigue la rama $BRANCH."
          else
            git checkout -b "$BRANCH"
            echo "Rama nueva $BRANCH desde $GITHUB_REF_NAME."
          fi

      - uses: actions/setup-python@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/portraits/requirements.txt

      - if: steps.secrets.outputs.ok == 'true'
        run: pip install -r tools/portraits/requirements.txt

      - name: Tests of the tool
        if: steps.secrets.outputs.ok == 'true'
        working-directory: tools
        run: python -m unittest discover -s portraits/tests -t .

      - name: What is missing
        id: status
        if: steps.secrets.outputs.ok == 'true'
        working-directory: tools
        run: |
          python -m portraits "$KIND" --status | tee -a "$GITHUB_OUTPUT"
          if [ "$SCHEDULED" = "true" ] && grep -qx "pending=0" "$GITHUB_OUTPUT"; then
            echo "### Retratos: no falta ningún $KIND (ejecución programada: no se hace nada)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate
        id: run
        if: steps.secrets.outputs.ok == 'true' && (env.SCHEDULED != 'true' || steps.status.outputs.pending != '0')
        working-directory: tools
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          args=("$KIND" --provider cloudflare --summary "$GITHUB_STEP_SUMMARY")
          [ -n "$ONLY" ] && args+=(--only "$ONLY")
          [ "$FORCE" = "true" ] && args+=(--force)
          [ "$CHANGED" = "true" ] && args+=(--changed)
          [[ "$LIMIT" =~ ^[0-9]+$ ]] && [ "$LIMIT" -gt 0 ] && args+=(--limit "$LIMIT")
          set +e
          python -m portraits "${args[@]}"
          status=$?
          set -e
          # 0: all done (or stopped by the quota: what's done is kept); 1: some failed; 2: credentials
          echo "status=$status" >> "$GITHUB_OUTPUT"
          left=$(python -m portraits "$KIND" --status | sed -n 's/^pending=//p')
          echo "left=$left" >> "$GITHUB_OUTPUT"

      - name: Upload the review page and the pictures
        if: always() && steps.run.outcome != 'skipped' && steps.status.outputs.pictures != ''
        uses: actions/upload-artifact@v7
        with:
          name: portraits-${{ env.KIND }}-${{ github.run_number }}
          path: |
            tools/portraits/review.html
            tools/portraits/generated.json
            ${{ steps.status.outputs.pictures }}/*.webp
            ${{ steps.status.outputs.pictures }}/index.json
          if-no-files-found: ignore

      - name: Commit to the review branch
        if: always() && steps.run.outcome == 'success'
        env:
          PICTURES: ${{ steps.status.outputs.pictures }}
          LEFT: ${{ steps.run.outputs.left }}
        run: |
          git add "$PICTURES" tools/portraits/generated.json
          if git diff --cached --quiet; then
            echo "Sin imágenes nuevas: no se sube nada." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            n=$(git diff --cached --name-only --diff-filter=AM -- "$PICTURES/*.webp" | wc -l)
            git commit -m "portraits: $n retratos de $KIND (ejecución ${{ github.run_number }})"
          fi
          if [ -z "$(git rev-list "origin/$GITHUB_REF_NAME..HEAD")" ]; then
            exit 0 # nothing that the current branch doesn't have: no review branch
          fi
          # also pushes the merge of the current branch into it, if there was one
          git push origin "$BRANCH"
          url="${{ github.server_url }}/${{ github.repository }}/compare/${GITHUB_REF_NAME}...${BRANCH}?expand=1"
          {
            echo ""
            echo "### Revisar y fusionar"
            echo ""
            echo "- Rama: \`$BRANCH\` (${n:-0} imágenes nuevas o cambiadas en esta ejecución)"
            echo "- Página de revisión: descarga el artefacto **portraits-$KIND-${{ github.run_number }}** y abre \`tools/portraits/review.html\`"
            echo "- Comparar / abrir PR hacia \`${GITHUB_REF_NAME}\`: $url"
            if [ "${LEFT:-0}" != "0" ]; then
              echo "- Faltan **$LEFT** sin imagen: relanza la acción mañana (cuando se reinicie la cuota, 00:00 UTC) o espera a la ejecución diaria; seguirá en esta misma rama."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Result
        if: always() && steps.run.outcome == 'success'
        run: |
          case "${{ steps.run.outputs.status }}" in
            0) echo "Hecho." ;;
            1) echo "::warning::Algunas imágenes fallaron (ver el resumen); las demás están en la rama $BRANCH."; exit 1 ;;
            *) echo "::error::No se pudo generar (credenciales o permisos: ver el log)."; exit 1 ;;
          esac
