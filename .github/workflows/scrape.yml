name: Extraer datos de las wikis

# Lánzalo a mano (Actions → "Extraer datos de las wikis" → Run workflow) cuando salga contenido nuevo.
on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: "Descargar todo de nuevo (ignora la caché de páginas)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        working-directory: tools/scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/scraper/requirements.txt

      - run: pip install -r requirements.txt

      # What a previous run translated but couldn't commit (e.g. it failed) is merged with the repo's.
      - name: Keep the repo's translation cache aside
        run: cp translations.es.json "$RUNNER_TEMP/translations.repo.json" 2>/dev/null || true

      - name: Restore translation cache backup
        uses: actions/cache/restore@v4
        with:
          path: tools/scraper/translations.es.json
          key: translations-es-${{ github.run_id }}
          restore-keys: translations-es-

      - name: Merge translation caches
        run: |
          python - <<'PY'
          import json, os, pathlib
          merged = {}
          for p in [pathlib.Path(os.environ["RUNNER_TEMP"]) / "translations.repo.json", pathlib.Path("translations.es.json")]:
              if p.exists():
                  merged.update(json.loads(p.read_text(encoding="utf-8")))
          if merged:
              pathlib.Path("translations.es.json").write_text(
                  json.dumps(merged, ensure_ascii=False, indent=0, sort_keys=True) + "\n", encoding="utf-8")
          print(f"{len(merged)} traducciones en caché")
          PY

      # Downloaded pages are cached between runs; only pages changed since (sitemap lastmod) are fetched again.
      - name: Restore page cache
        if: ${{ !inputs.full_refresh }}
        uses: actions/cache/restore@v4
        with:
          path: tools/scraper/.cache
          key: wiki-pages-${{ github.run_id }}
          restore-keys: wiki-pages-

      # Extracts data/*.json and then translates what's new or changed into data/es/*.json.
      # If the translator asks to slow down for too long, what's done is kept and the next run goes on.
      - name: Scrape, build data/*.json and translate to data/es/*.json
        run: python -m dndscraper --delay 0.5 --translate-budget 90

      - name: Validate data
        run: python -m dndscraper.validate

      - name: Save page cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: tools/scraper/.cache
          key: wiki-pages-${{ github.run_id }}

      # Backup of what's translated, in case the run fails before committing it.
      - name: Save translation cache
        if: always() && hashFiles('tools/scraper/translations.es.json') != ''
        uses: actions/cache/save@v4
        with:
          path: tools/scraper/translations.es.json
          key: translations-es-${{ github.run_id }}

      - name: Commit changes
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data tools/scraper/report.md
          if [ -f tools/scraper/translations.es.json ]; then git add tools/scraper/translations.es.json; fi
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "data: actualizar extracción de las wikis"
            # The branch may have moved on while this ran (it takes a while): bring it in first.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Summary
        if: always()
        working-directory: .
        run: |
          if [ -f tools/scraper/report.md ]; then
            sed -n '1,/## Conservados/p' tools/scraper/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          (cd tools/scraper && python -m dndscraper.translate --summary) >> "$GITHUB_STEP_SUMMARY"
