<button type="button" class="skip-link" (click)="main.focus()">{{ 'shell.skip' | t }}</button>
<header class="topbar">
  <a class="brand" routerLink="/compendium" [attr.aria-label]="'app.home' | t" (click)="toTop()">{{
    'app.title' | t
  }}</a>
  <nav [attr.aria-label]="'shell.nav' | t">
    @for (item of nav; track item.path) {
      <a
        [routerLink]="item.path"
        [attr.data-icon]="item.path"
        [class.active]="activeTab() === item.path"
        [attr.aria-current]="activeTab() === item.path ? 'page' : null"
      >
        {{ item.label | t }}
      </a>
    }
  </nav>
  <div class="sync" role="status">
    <!-- sync state and update buttons: loaded once the first page is on screen (shell-status.ts) -->
    @defer (on idle) {
      <app-shell-status />
    }
  </div>
  <button
    type="button"
    class="theme"
    [attr.data-theme-now]="theme()"
    (click)="toggleTheme()"
    [attr.aria-label]="(theme() === 'dark' ? 'shell.themeToLight' : 'shell.themeToDark') | t"
    [title]="(theme() === 'dark' ? 'shell.themeToLight' : 'shell.themeToDark') | t"
  ></button>
  <select
    class="lang"
    [value]="language()"
    (change)="setLanguage($any($event.target).value)"
    [attr.aria-label]="'settings.language' | t"
  >
    <option value="es">{{ 'lang.es' | t }}</option>
    <option value="en">{{ 'lang.en' | t }}</option>
  </select>
</header>

<main class="page" id="main" tabindex="-1" #main>
  @defer (on idle) {
    <app-apk-update-notice />
  }
  <router-outlet />
</main>

<app-back-to-top />
