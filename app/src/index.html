<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>D&amp;D Helper</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3b2416" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a110b" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="D&amp;D Helper" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..600&family=IM+Fell+English:ital@0;1&family=Pirata+One&family=Cinzel+Decorative:wght@700&display=swap"
    />
  </head>
  <body>
    <!-- shown until the app draws its first page (Angular replaces it); main.ts marks a failure -->
    <app-root>
      <div id="boot" role="status" aria-live="polite">
        <p class="boot-title">D&amp;D Helper</p>
        <p class="boot-wait">Abriendo el diario… · Opening the journal…</p>
        <p class="boot-failed">
          No se pudo abrir la app · The app could not start.
          <a href="">Recargar · Reload</a>
        </p>
      </div>
    </app-root>
    <noscript>D&amp;D Helper necesita JavaScript · needs JavaScript.</noscript>
  </body>
</html>
