# Correcciones que se aplican al texto ya traducido (palabra completa; respeta la mayúscula
# inicial). Sirven para lo que el traductor dice mal de forma sistemática. A diferencia de
# terms.es.yaml, cambiar esto no obliga a traducir nada otra vez. Usa solo cambios que no alteren
# el género de la palabra (hechizo → conjuro sí; ranura → espacio no).

