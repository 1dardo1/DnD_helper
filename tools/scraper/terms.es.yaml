# Términos de juego que el traductor automático suele traducir mal. Antes de traducir, cada aparición
# (sin distinguir mayúsculas, la más larga primero) se sustituye por un marcador; después se pone el
# texto de aquí. Si cambias solo el español de un término no hace falta volver a traducir nada; si
# añades un término nuevo, se vuelven a traducir los textos que lo contienen.
#
# Ojo: el término se inserta tal cual, así que el artículo que lo rodee lo decide el traductor.
# Mejor términos de varias palabras y poco ambiguos.

