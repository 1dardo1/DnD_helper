# Prompts for the AI species portraits (FLUX.1 schnell, Cloudflare Workers AI).
# Full prompt sent to the model = style + ", " + species prompt.
# style: the common prefix added before every species description (one consistent look)
style: >-
  Full-body character portrait for a fantasy field journal, ink and watercolour
  sketch on aged parchment, warm sepia and ochre palette with muted reds, soft
  hand-drawn linework, plain parchment background, single figure, centred,
  standing in a neutral pose, whole body visible from head to feet, no text, no border
negative: >-
  text, letters, caption, watermark, signature, frame, border, multiple people,
  crowd, photo, photorealistic, 3d render, blurry, deformed hands, extra limbs,
  cropped feet, gore, nudity
species:
  aarakocra:
    prompt: >-
      A lean bird-person with the head of an eagle, a hooked yellow beak and keen golden eyes,
      brown and white feathers, large feathered wings folded on its back, taloned bird feet
      and clawed hands; wears a light leather harness and carries a javelin.
    seed: 1001
