# Prompts for the AI monster pictures (FLUX.1 schnell, Cloudflare Workers AI).
# Full prompt sent to the model = style + ", " + monster prompt.
# style: the common prefix added before every monster description (one consistent look)
style: >-
  Full-body bestiary illustration for a fantasy field journal, ink and watercolour sketch on
  aged parchment, warm sepia and ochre palette with muted reds, soft hand-drawn linework,
  plain parchment background, single creature, centred, full body of the creature visible
  from head to tail, no text, no border
negative: >-
  text, letters, caption, watermark, signature, frame, border, multiple creatures, crowd,
  photo, photorealistic, 3d render, blurry, deformed anatomy, extra limbs, cropped body,
  gore, blood, nudity
